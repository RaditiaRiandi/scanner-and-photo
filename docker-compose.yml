version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: planc_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-planc_db}
      POSTGRES_USER: ${DB_USER:-planc_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-planc_secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-planc_user} -d ${DB_NAME:-planc_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - planc_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: planc_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      API_PORT: ${API_PORT:-8089}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-planc_db}
      DB_USER: ${DB_USER:-planc_user}
      DB_PASSWORD: ${DB_PASSWORD:-planc_secret}
      PHOTOS_DIR: /app/photos
    ports:
      - "${API_PORT:-8089}:8089"
    volumes:
      - ./photos:/app/photos
      - ./backend/app:/app/app
    networks:
      - planc_network

volumes:
  pgdata:
    driver: local

networks:
  planc_network:
    driver: bridge
